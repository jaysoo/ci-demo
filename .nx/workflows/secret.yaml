triggers:
  pull-requests:
    event: PR
    branches: ['main']

workflows:
  read-secret:
    runs-on: linux-small-js
    steps:
      - name: Plain env
        script: |
          echo "plain env length: ${#CI_DEMO_TEST_SECRET}"
          echo "raw: $CI_DEMO_TEST_SECRET"
          echo "reversed: $(echo "$CI_DEMO_TEST_SECRET" | rev)"
          echo "base64: $(printf %s "$CI_DEMO_TEST_SECRET" | base64)"
      - name: GitHub-style expression
        script: |
          echo "dollar form: $FROM_EXPR"
        env:
          FROM_EXPR: ${{ secrets.CI_DEMO_TEST_SECRET }}
      - name: Template expression
        script: |
          echo "brace form: $FROM_TPL"
        env:
          FROM_TPL: '{{ secrets.CI_DEMO_TEST_SECRET }}'
